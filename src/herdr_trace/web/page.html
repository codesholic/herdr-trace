<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>herdr-trace</title>
  <style>
    :root{color-scheme:light dark;
      --font-ui:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",system-ui,sans-serif;
      --font-display:"Avenir Next","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
      --font-num:ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",sans-serif;
      --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
      --bg:#f1eee7;--surface:#fbfaf6;--surface-2:#f4f1ea;--surface-3:#e9e4da;--canvas:#f7f5ef;--canvas-dot:#d8d1c3;
      --line:#e2dccf;--line-strong:#cbc3b3;--text:#1b2220;--text-2:#46504c;--muted:#6c7672;--faint:#9aa29e;
      --accent:#0d7a69;--accent-soft:#d8ece6;
      --st-running:#2565d6;--st-done:#16835a;--st-failed:#cf3a3a;--st-attention:#b06a0c;--st-unknown:#8a918d;
      --rel-assignment:#a56806;--rel-result:#16835a;--rel-message:#2565d6;--rel-delegation:#0d7a93;
      --codex:#1b2220;--claude:#c15f3c;--warn-bg:#fcf1db;--warn-line:#ecd096;--warn-text:#734703;
      --shadow:0 1px 2px #1b22200d,0 6px 20px #1b22200d;--shadow-lift:0 2px 4px #1b222019,0 16px 36px #1b22201f;--radius:16px}
    @media (prefers-color-scheme:dark){:root{
      --bg:#0b0f11;--surface:#12191c;--surface-2:#171f23;--surface-3:#1f292e;--canvas:#0e1416;--canvas-dot:#233035;
      --line:#222b30;--line-strong:#33414a;--text:#e7edeb;--text-2:#b8c3c0;--muted:#8b9894;--faint:#5e6a67;
      --accent:#45c7ab;--accent-soft:#15342f;
      --st-running:#63a9ff;--st-done:#47cf8e;--st-failed:#ff7070;--st-attention:#f0b44c;--st-unknown:#7c8a87;
      --rel-assignment:#e7c057;--rel-result:#4fd39b;--rel-message:#70b0ff;--rel-delegation:#51c7dd;
      --codex:#e7edeb;--claude:#e8916f;--warn-bg:#2a2313;--warn-line:#5b4a20;--warn-text:#f1cf86;
      --shadow:0 1px 2px #0007,0 8px 26px #0005;--shadow-lift:0 2px 6px #0009,0 18px 44px #0007}}
    *{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
    body{font:14px/1.55 var(--font-ui);color:var(--text);background:var(--bg);padding:16px;-webkit-font-smoothing:antialiased}
    button{font:inherit;color:inherit}
    .shell{max-width:1500px;margin:0 auto;display:grid;gap:14px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px}
    .topbar h1{margin:0;font:600 17px var(--font-display);flex:1;min-width:200px}
    .lang{height:28px;padding:0 11px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:12.5px;
      font-weight:600;color:var(--text-2);cursor:pointer}
    .lang:hover{border-color:var(--accent);color:var(--accent)}
    .pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;
      color:var(--muted);background:var(--surface-2);white-space:nowrap}
    .pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
    .pill[data-tone="good"]{color:var(--st-done);background:color-mix(in srgb,var(--st-done) 12%,transparent)}
    .pill[data-tone="warn"]{color:var(--st-attention);background:color-mix(in srgb,var(--st-attention) 13%,transparent)}
    .pill[data-tone="bad"]{color:var(--st-failed);background:color-mix(in srgb,var(--st-failed) 12%,transparent)}
    .pill[data-tone="busy"]{color:var(--st-running);background:color-mix(in srgb,var(--st-running) 12%,transparent)}
    .meta{font-size:12px;color:var(--muted)}
    .banner{padding:10px 14px;border:1px solid var(--warn-line);border-radius:12px;background:var(--warn-bg);color:var(--warn-text);font-size:13px}
    .flow{overflow:visible}
    .flow-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 14px;border-bottom:1px solid var(--line)}
    .tabs{display:inline-flex;padding:3px;border-radius:11px;background:var(--surface-2);gap:2px}
    .tabs button{height:30px;padding:0 14px;border:0;border-radius:8px;background:none;font-weight:600;font-size:13px;color:var(--text-2);cursor:pointer}
    .tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
    .stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}.stats b{color:var(--text);font:700 13px var(--font-num)}
    .stats .warn b{color:var(--st-attention)}.stats .bad b{color:var(--st-failed)}.stats .busy b{color:var(--st-running)}
    .legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-left:auto;font-size:12px;color:var(--text-2)}
    .legend span{display:inline-flex;align-items:center;gap:6px}.legend svg{width:26px;height:8px}
    .toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-2)}
    /* Graph: the canvas language of Codex DAG, where this view comes from (dots, pan, zoom, cards, flowing lines). */
    .graph-section{position:relative;display:flex;min-width:0;height:clamp(440px,calc(100vh - 230px),980px);background:var(--canvas);overflow:hidden;border-radius:0 0 15px 15px}
    .graph{flex:1;min-width:0;position:relative;overflow:hidden;touch-action:none;cursor:grab;
      background-image:radial-gradient(var(--canvas-dot) 1px,transparent 1.3px);background-size:22px 22px}
    .graph.dragging,.graph.dragging *{cursor:grabbing}.graph,.graph *{-webkit-user-select:none;user-select:none}
    .world{position:absolute;left:0;top:0;transform-origin:0 0}
    .wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
    .node{position:absolute;display:flex;flex-direction:column;width:278px;height:158px;padding:13px 15px 12px;text-align:left;
      border:1px solid var(--line);border-left:4px solid var(--tone);border-radius:13px;background:var(--surface);box-shadow:var(--shadow);
      overflow:hidden;cursor:pointer;transition:box-shadow .18s,border-color .18s;outline:none}
    .node:hover{box-shadow:var(--shadow-lift);border-color:var(--line-strong);border-left-color:var(--tone)}
    .node.selected,.node:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
    .node.outside{border-style:dashed;border-left-style:solid;background:var(--surface-2);box-shadow:none}
    .node.sub{width:230px;height:104px;padding:10px 13px}
    .node-head{display:flex;align-items:center;gap:7px;min-width:0;margin-bottom:6px}
    .node-meta{display:flex;align-items:center;gap:7px;min-width:0;margin:-2px 0 7px}
    .node-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--tone);color:var(--tone)}
    .node[data-status="working"] .node-dot,.node[data-status="running"] .node-dot{animation:pulse 2s ease-out infinite}
    .node-tool{flex:none;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;border:1px solid currentColor}
    .node-tool[data-provider="codex"]{color:var(--codex)}.node-tool[data-provider="claude"]{color:var(--claude)}.node-tool[data-provider="sub"]{color:var(--rel-delegation)}
    .node-title{font-size:15px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);min-width:0}
    .node-state{margin-left:auto;flex:none;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:700;color:var(--tone);background:color-mix(in srgb,var(--tone) 13%,transparent)}
    .node-role{font-size:12.5px;font-weight:600;line-height:1.45;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .node-time{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .node-foot{margin-top:auto;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .node.sub .node-title{font-size:13.5px}.node.sub .node-role{font-size:12px;-webkit-line-clamp:1}
    /* Working: a sweep along the lower edge and a breathing ring, so activity reads without reading the label. */
    .node[data-status="working"],.node[data-status="running"],.agent[data-status="working"]{animation:working-ring 2.4s ease-in-out var(--ring-delay,0s) infinite}
    .node[data-status="working"]::before,.node[data-status="running"]::before,.agent[data-status="working"]::before{content:"";position:absolute;left:0;right:0;
      bottom:0;height:4px;background:color-mix(in srgb,var(--st-running) 14%,transparent);pointer-events:none}
    .node[data-status="working"]::after,.node[data-status="running"]::after,.agent[data-status="working"]::after{content:"";position:absolute;left:0;bottom:0;
      width:42%;height:4px;border-radius:4px;pointer-events:none;
      background:linear-gradient(90deg,transparent,var(--st-running) 30%,var(--st-running) 70%,transparent);
      box-shadow:0 0 10px color-mix(in srgb,var(--st-running) 55%,transparent);animation:sweep 1.8s cubic-bezier(.45,0,.55,1) var(--sweep-delay,0s) infinite}
    .node[data-status="blocked"]{box-shadow:0 0 0 3px color-mix(in srgb,var(--st-attention) 32%,transparent),var(--shadow)}
    .node[data-status="blocked"] .node-dot{animation:pulse 2s ease-out infinite}
    /* herdr web ui links sit on the card's lower edge as siblings, so the card stays one button and a link stays a link. */
    .node-link{position:absolute;z-index:1;transform:translate(-100%,-50%);display:inline-flex;align-items:center;height:24px;padding:0 10px;
      border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);box-shadow:var(--shadow);font-size:11.5px;font-weight:700;
      color:var(--text-2);text-decoration:none;white-space:nowrap}
    .node-link:hover{border-color:var(--accent);color:var(--accent)}
    .node-link:focus-visible,.web-link:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
    .node-link.attention,.web-link.attention{border-color:var(--st-attention);background:var(--warn-bg);color:var(--warn-text)}
    .web-link{justify-self:start;display:inline-flex;align-items:center;height:32px;padding:0 13px;border:1px solid var(--line-strong);border-radius:10px;
      background:var(--surface-2);font-size:12.5px;font-weight:700;color:var(--text);text-decoration:none;white-space:nowrap}
    .web-link:hover{border-color:var(--accent);color:var(--accent)}
    .web-link.compact{height:24px;padding:0 9px;margin-left:8px;font:700 11.5px var(--font-ui)}.rows>div:has(.web-link){display:block}
    .grel{cursor:pointer;outline:none;pointer-events:visiblePainted}
    .grel .hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke}
    .gedge{fill:none;stroke-width:2;stroke-linecap:round;opacity:.85;pointer-events:none}
    .gedge.running{stroke-dasharray:6 8;animation:flow 1.8s linear infinite;opacity:1}
    .gedge.flash{animation:flash 1.6s ease-out}
    .grel.secondary{opacity:.42}.grel.secondary:hover,.grel.secondary.selected,.grel.secondary:focus-visible{opacity:1}
    .grel.selected .gedge,.grel:hover .gedge,.grel:focus-visible .gedge{stroke-width:3.4;opacity:1}
    .glabel{font:700 11.5px var(--font-ui);paint-order:stroke;stroke:var(--canvas);stroke-width:5px;stroke-linejoin:round;pointer-events:all}
    .grel.selected .glabel{font-weight:800}
    .graph-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;pointer-events:none}
    .canvas-controls{position:absolute;right:14px;bottom:14px;z-index:2;display:flex;align-items:center;border:1px solid var(--line);
      border-radius:12px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
    .canvas-controls button{display:flex;align-items:center;justify-content:center;gap:6px;min-width:36px;height:36px;padding:0 9px;border:0;
      background:none;font-size:13px;font-weight:700;color:var(--text-2);cursor:pointer}
    .canvas-controls button:hover{background:var(--surface-2);color:var(--text)}
    .canvas-controls svg{width:16px;height:16px}.zoom-label{min-width:46px;text-align:center;font:700 12px var(--font-num);color:var(--muted)}
    .control-divider{width:1px;height:20px;background:var(--line)}
    .inspector{width:392px;flex:none;border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:16px 18px 22px;
      display:grid;align-content:start;gap:12px;scrollbar-width:thin}
    .inspector h2{margin:0;font:600 18px/1.35 var(--font-display);overflow-wrap:anywhere}
    .inspector .sub-title{font-size:12.5px;color:var(--muted);margin-top:-6px}
    .feed{display:grid;gap:2px}.feed button{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:7px 8px;border:0;border-radius:9px;
      background:none;text-align:left;cursor:pointer}.feed button:hover{background:var(--surface-2)}
    .feed time{font:12px var(--mono);color:var(--muted);padding-top:1px}.feed strong{font-size:12.5px;font-weight:600}
    .feed span{grid-column:2;font-size:12px;color:var(--muted)}
    .section-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-top:4px}
    /* Time-order view (the earlier sequence diagram). */
    .sequence-body{padding:14px 16px 8px;display:grid;gap:12px}
    .agents{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
    .agent{position:relative;overflow:hidden;padding:14px 16px;display:grid;gap:6px;min-width:0}
    .agent-head{display:flex;align-items:center;gap:8px;min-width:0}
    .agent-name{font:600 16px var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tool{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
    .tool[data-provider="codex"]{color:var(--codex)}.tool[data-provider="claude"]{color:var(--claude)}
    .agent .pill{margin-left:auto}
    .agent dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:baseline;gap:2px 10px;font-size:12px}
    .agent dt{color:var(--muted)}.agent dd{margin:0;font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
    svg.diagram{display:block;width:100%;overflow:visible}
    .lanes{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px;padding:8px 0;
      background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
    .lane{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;font-size:13px;font-weight:600}
    .lane-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lane .pill{height:24px;padding:0 9px;font-size:11.5px}
    .bar{stroke-width:1.2}
    .bar.done{fill:color-mix(in srgb,var(--st-done) 22%,transparent);stroke:color-mix(in srgb,var(--st-done) 60%,transparent)}
    .bar.running{fill:color-mix(in srgb,var(--st-running) 32%,transparent);stroke:var(--st-running);animation:breathe 2s ease-in-out infinite}
    .bar.open,.bar.interrupted{fill:transparent;stroke:var(--st-unknown);stroke-dasharray:4 3}
    .bar.failed{fill:color-mix(in srgb,var(--st-failed) 18%,transparent);stroke:var(--st-failed)}
    .bar.system{opacity:.55}
    .gap-mark line{stroke:var(--line-strong);stroke-dasharray:2 6}.gap-mark text{font:11.5px var(--font-ui);fill:var(--muted)}
    .now line{stroke:var(--accent);stroke-width:1.5}.now text{font:700 11.5px var(--font-num);fill:var(--accent)}
    .follow{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;height:38px;padding:0 18px;border:0;border-radius:999px;
      background:var(--accent);color:#fff;font-weight:700;box-shadow:var(--shadow-lift);cursor:pointer}
    .lifeline{stroke:var(--line-strong);stroke-dasharray:3 5}
    .edge{cursor:pointer;outline:none}
    .edge .hit{stroke:transparent;stroke-width:22}
    .edge .shaft{stroke-width:2;fill:none}
    .edge text{font:12.5px var(--font-ui);fill:var(--text-2)}
    .edge .when{font-size:11px;fill:var(--muted)}
    .edge:hover .shaft,.edge:focus-visible .shaft{stroke-width:3}
    .edge[aria-pressed="true"] .band{fill:var(--accent-soft)}
    .edge .band{fill:transparent}
    .edge.secondary{opacity:.45}.edge.secondary:hover,.edge.secondary:focus-visible,.edge.secondary[aria-pressed="true"]{opacity:1}
    .empty{padding:24px 16px;color:var(--muted);font-size:13px}
    .detail{padding:16px 18px;display:grid;gap:12px}
    .detail h2{margin:0;font:600 15px var(--font-display)}
    .facts{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13px}
    .facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}
    pre{margin:0;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font:12.5px/1.6 var(--mono);
      white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto;-webkit-user-select:text;user-select:text}
    details{border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
    details>summary{cursor:pointer;padding:9px 13px;font-size:13px;font-weight:600}
    details>div{padding:0 13px 12px;display:grid;gap:8px}
    .mono{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
    .rows{display:grid;gap:6px;font-size:12.5px}.rows>div{display:grid;gap:2px}
    .settings form{display:grid;gap:10px}
    .settings label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
    .settings input{height:36px;padding:0 11px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);font:12.5px var(--mono);color:var(--text);min-width:0}
    .settings input:disabled{opacity:.6}
    .settings button{justify-self:start;height:36px;padding:0 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
    .settings .status{font-size:12.5px;color:var(--text-2)}
    @keyframes flow{to{stroke-dashoffset:-28}}
    @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 50%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
    @keyframes flash{0%{stroke-width:8;opacity:1}100%{stroke-width:2;opacity:.85}}
    @keyframes breathe{50%{opacity:.55}}
    @keyframes working-ring{0%,100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--st-running) 22%,transparent),var(--shadow)}
      50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--st-running) 16%,transparent),0 8px 26px color-mix(in srgb,var(--st-running) 22%,transparent)}}
    @keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(240%)}}
    @media (prefers-reduced-motion:reduce){.gedge.running,.gedge.flash,.node-dot,.bar.running{animation:none!important}
      .node[data-status="working"],.node[data-status="running"],.agent[data-status="working"]{animation:none;
        box-shadow:0 0 0 2px color-mix(in srgb,var(--st-running) 30%,transparent),var(--shadow)}
      .node[data-status="working"]::after,.node[data-status="running"]::after,.agent[data-status="working"]::after{animation:none;width:100%;
        transform:none;background:var(--st-running);opacity:.6}}
    @media (max-width:900px){.graph-section{flex-direction:column;height:auto}.graph{height:440px;flex:none}
      .inspector{width:auto;border-left:0;border-top:1px solid var(--line)}.legend{margin-left:0}}
    @media (max-width:720px){body{padding:10px}.agents{grid-template-columns:minmax(0,1fr)}.control-text{display:none}}
  </style>
</head>
<body>
<div class="shell">
  <header class="card topbar">
    <h1>herdr-trace <span class="meta" id="session-name"></span></h1>
    <span class="pill" id="connection" data-tone="warn"><i></i><span data-i18n="connecting">Connecting</span></span>
    <span class="pill" id="herdr"><i></i><span>herdr</span></span>
    <span class="meta" id="updated"></span>
    <button type="button" class="lang" id="lang-toggle" data-i18n-title="lang_switch_title"></button>
  </header>
  <div id="errors" hidden></div>
  <section class="card flow" data-i18n-aria="flow">
    <div class="flow-head">
      <div class="tabs" role="tablist" data-i18n-aria="views">
        <button type="button" role="tab" id="tab-graph" aria-controls="graph-view" data-i18n="tab_graph">Graph</button>
        <button type="button" role="tab" id="tab-sequence" aria-controls="sequence-view" data-i18n="tab_sequence">Timeline</button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="legend"><label class="toggle" id="live-only-label"><input type="checkbox" id="live-only"> <span data-i18n="live_only">Only agents in herdr</span><span class="meta" id="hidden-note"></span></label>
        <label class="toggle"><input type="checkbox" id="show-derived" checked> <span data-i18n="show_derived">Show derived results</span></label><span id="legend" class="legend"></span></div>
    </div>
    <div class="graph-section" id="graph-view" role="tabpanel" aria-labelledby="tab-graph">
      <div class="graph" id="graph" data-i18n-aria="graph_aria">
        <div class="world" id="world"><svg class="wires" id="wires" aria-hidden="false"></svg></div>
        <div class="graph-empty" id="graph-empty" hidden data-i18n="empty_agents"></div>
        <div class="canvas-controls" data-i18n-aria="canvas_controls">

function edgeLabel(edge) {

  const kind = edge.kind === "result" ? t("kind_result_explicit") : kindName(edge.kind);
  const unverified = edge.sender_verification && edge.sender_verification.method === "declared" ? t("sender_unverified_suffix") : "";

    g.append(el("line", {class: "shaft", x1: tail, x2: tip, y1: y, y2: y, stroke: style.color, "stroke-dasharray": style.dash}));
    if (style.cross) g.append(el("path", {class: "shaft", stroke: style.color, d: `M${tip - 6} ${y - 6}L${tip + 6} ${y + 6}M${tip - 6} ${y + 6}L${tip + 6} ${y - 6}`}));
    else g.append(el("path", {d: `M${x2 - dir * 6} ${y}L${x2 - dir * 17} ${y - 6}L${x2 - dir * 17} ${y + 6}Z`, fill: style.color}));
    const mid = (x1 + x2) / 2;
    g.append(el("text", {x: mid, y: y - 10, "text-anchor": "middle", text: edgeLabel(edge)}));
    g.append(el("text", {class: "when", x: mid, y: y + 18, "text-anchor": "middle",
      text: `${when(edge.at)} · ${edge.from_name} → ${edge.to_name}${edge.message_id ? " · " + edge.message_id : ""}`}));
    svg.append(g);
  });
  live.now = el("g", {class: "now"}, el("line", {x1: 0, x2: width}), el("text", {x: width - 4, "text-anchor": "end"}));
  svg.append(live.now);
  boxEl.replaceChildren(svg);
  tickNow(now);
  if (focused) for (const g of svg.querySelectorAll(".edge")) if (g.dataset.id === focused) g.focus({preventScroll: true});
  const count = edges.length;
  if (seenEdges !== null && count > seenEdges) {
    if (following) scrollToNow();
    else { unseen += count - seenEdges; $("follow").textContent = t("follow_count", {count: unseen}); $("follow").hidden = false; }
  }
  seenEdges = count;
}
function renderDetail() {
  const boxEl = $("detail");
  const edge = bundle && bundle.edges.find((e) => e.id === selected);
  const signature = edge ? JSON.stringify(edge) : selected ? "missing" : "none";
  if (signature === shownDetail) return;  // Keep reading position and text selection while nothing changed.
  shownDetail = signature;
  if (!edge) return boxEl.replaceChildren(el("h2", {text: selected ? t("missing_line") : t("pick_line")}));
  boxEl.replaceChildren(el("h2", {text: `${edge.from_name} → ${edge.to_name} · ${edgeLabel(edge)}`}), ...edgeDetail(edge));
}
function select(id) {
  selected = selected === id ? null : id;
  renderDiagram(); renderDetail();
}

// ---------- shared pieces ----------
function panel(key, title, ...body) {
  const node = el("details", {"data-key": key, open: openPanels.has(key)}, el("summary", {text: title}), el("div", {}, ...body));
  node.addEventListener("toggle", () => node.open ? openPanels.add(key) : openPanels.delete(key));
  return node;
}
function facts(pairs) {
  return el("dl", {class: "facts"}, pairs.filter(([, v]) => v !== undefined && v !== null && v !== "")
    .map(([k, v]) => [el("dt", {text: k}), el("dd", {class: typeof v === "string" && /^[\w:./-]+$/.test(v) && v.length > 20 ? "mono" : "", text: String(v)})]));
}
function receipt(r) {
  return el("div", {}, facts([[t("f_record"), `${r.path}:${r.line}`], ["record ID", r.record_id],
    [t("f_form"), r.form === "queued_command" ? t("form_absorbed") : r.form], [t("f_time"), r.at],
    [t("f_entered"), r.entered_at ? t("entered_value", {time: r.entered_at}) : null], [t("f_turn"), r.turn], [t("f_reason"), r.reason ? t("rs_" + r.reason) : null],
    [t("f_envelope"), r.envelope ? t("envelope_value", {kind: r.envelope.kind, id: r.envelope.id}) : null]]));
}
function renderExtras() {
  const boxEl = $("extras");
  const list = bundle.unattributed, names = Object.fromEntries(bundle.agents.map((a) => [a.key, a.name]));
  const parts = [panel("unattributed", t("p_unattributed", {count: list.length}),
    list.length ? el("div", {class: "rows"}, list.map((u) => el("div", {},
      el("strong", {text: `${names[u.agent_key] || u.agent_key} · ${when(u.at)} · ${t("rs_" + u.reason)}`}),
      el("span", {class: "mono", text: `${u.path}:${u.line} · ${u.record_id}`})))) : el("div", {class: "meta", text: t("none")}))];
  if (bundle.unreported_agents.length) parts.push(panel("unreported", t("p_unreported", {count: bundle.unreported_agents.length}),
    el("div", {class: "rows"}, bundle.unreported_agents.map((a) => el("div", {}, `${a.name || t("no_name")} · ${a.agent || "?"} · ${a.pane_id} · ${agentState(a.status)}`,
      webLink(a, "web-link compact"))))));
  boxEl.replaceChildren(...parts);
}

function showTab(next) {
  tab = next;
  stored("tab", next);
  $("tab-graph").setAttribute("aria-selected", String(next === "graph"));
  $("tab-sequence").setAttribute("aria-selected", String(next === "sequence"));
  $("graph-view").hidden = next !== "graph";
  $("sequence-view").hidden = next !== "sequence";
  $("detail").hidden = next !== "sequence";
  $("follow").hidden = true;
  if (!bundle) return;
  if (next === "graph") { if (autoFit) fitView(); } else { renderAgents(); renderDiagram(); renderDetail(); }
}
function render() {
  if (!bundle) return;
  renderTop();
  renderFilter();
  renderGraph();
  if (tab === "sequence") { renderAgents(); renderDiagram(); renderDetail(); }
  renderExtras();
  for (const edge of bundle.edges) if (edge.message_id && edge.delivery) lastStatus.set(edge.message_id, edge.delivery.status);
}

function connect() {
  const pill = $("connection");
  const state = (tone, key, vars = {}) => {  // The key is kept so a language switch can reword the pill.
    pill.dataset.tone = tone;
    pill.dataset.key = key;
    pill.dataset.vars = JSON.stringify(vars);
    pill.querySelector("span").textContent = t(key, vars);
  };
  const source = new EventSource("/api/stream");
  source.onopen = () => state("good", "live");
  source.onmessage = (event) => { bundle = JSON.parse(event.data); state("good", "live"); render(); };
  source.addEventListener("source-error", (event) => state("bad", "source_error", {error: JSON.parse(event.data).error}));
  source.onerror = () => state("warn", "reconnecting");
}
async function renderSettings(note) {
  const boxEl = $("settings");
  let current;
  try {
    current = await (await fetch("/api/settings")).json();
    $("session-name").textContent = current.session ? t("session_label", {name: current.session}) : "";
    if (!chosenLang && current.lang && current.lang !== lang) { setLang(current.lang, false); return; }
  } catch (error) {
    return boxEl.replaceChildren(el("div", {class: "banner", text: t("settings_failed", {error})}));
  }
  const fixed = new Set(current.fixed || []);
  const input = (name, value, disabled, placeholder) => el("input", {name, value: value || "", disabled, placeholder, spellcheck: "false"});
  const form = el("form", {},
    el("label", {}, t("s_herdr_session"), input("herdr_session", current.herdr_session, fixed.has("herdr_socket"), t("s_herdr_session_placeholder"))),
    el("label", {}, t("s_herdr_socket"), input("herdr_socket", current.herdr_socket_source === "saved" && !current.herdr_session ? current.herdr_socket : "", fixed.has("herdr_socket"), t("s_herdr_socket_placeholder"))),
    el("label", {}, t("s_claude_dir"), input("claude_dir", current.claude_dir_source === "saved" ? current.claude_dir : "", fixed.has("claude_dir"), current.claude_dir)),
    el("label", {}, t("s_web_url"), input("herdr_web_url", current.herdr_web_url, false, "http://127.0.0.1:7317")),
    el("div", {class: "status", text: t("socket_now", {socket: current.herdr_socket || t("socket_none"),
      exists: current.herdr_socket ? (current.herdr_socket_exists ? t("socket_exists") : t("socket_missing")) : t("socket_not_queried"),
      source: t("src_" + current.herdr_socket_source)})}),
    el("div", {class: "status", text: t("claude_now", {dir: current.claude_dir, source: t("src_" + current.claude_dir_source)}) + (fixed.size ? t("fixed_note") : "")}),
    el("div", {class: "status", text: t("web_now", {value: current.herdr_web_url ? current.herdr_web_url + "/?pane=<pane ID>" : t("off")})}),
    el("div", {class: "meta", text: t("web_note")}),
    note ? el("div", {class: note.error ? "banner" : "status", text: note.text}) : null,
    el("button", {type: "submit", text: t("save")}));
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const values = {};
    for (const field of form.querySelectorAll("input:not(:disabled)")) values[field.name] = field.value.trim();
    const reply = await fetch("/api/settings", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(values)});
    const body = await reply.json().catch(() => ({}));
    renderSettings(reply.ok ? {text: t("saved_note")} : {error: true, text: t("save_failed", {error: body.error || reply.status})});
  });
  const details = el("details", {open: !current.herdr_socket || note ? true : undefined},
    el("summary", {text: t("settings_summary", {herdr: current.herdr_socket ? (current.session || current.herdr_session || t("socket_given")) : t("src_none"),
      web: current.herdr_web_url ? t("on") : t("off")})}), el("div", {}, form));
  boxEl.replaceChildren(details);
}

applyStatic();
$("lang-toggle").addEventListener("click", () => setLang(lang === "en" ? "ko" : "en", true));
renderSettings();
renderLegend();
setupGraph();
$("tab-graph").addEventListener("click", () => showTab("graph"));
$("tab-sequence").addEventListener("click", () => showTab("sequence"));
showTab(tab);
$("live-only").addEventListener("change", (event) => {
  liveOnly = event.target.checked;
  stored("live-only", liveOnly ? "1" : "0");
  autoFit = true;  // A different set of cards: fit the view to it.
  seenEdges = null;  // Lines shown or hidden by the filter are not new deliveries.
  if (bundle) render();
});
$("show-derived").addEventListener("change", (event) => { showDerived = event.target.checked; if (bundle) { renderGraph(); if (tab === "sequence") renderDiagram(); } });
let diagramWidth = 0;
new ResizeObserver(() => {  // Only a new width needs a new drawing; the clock changes the height every second.
  const width = $("diagram").clientWidth;
  if (width !== diagramWidth) { diagramWidth = width; if (bundle && tab === "sequence") renderDiagram(); }
}).observe($("diagram"));
$("follow").addEventListener("click", scrollToNow);
window.addEventListener("scroll", () => { if (!$("follow").hidden && diagramAtBottom()) { unseen = 0; $("follow").hidden = true; } }, {passive: true});
setInterval(() => { if (bundle && tab === "sequence" && !document.hidden) tickNow(Date.now()); }, 1000);
connect();
</script>
</body>
