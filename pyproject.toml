[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-trace"
dynamic = ["version"]
description = "See what passed between coding agents in herdr, and whether it arrived."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Environment :: Web Environment",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]

[project.scripts]
herdr-trace = "herdr_trace.cli:main"

[tool.setuptools.dynamic]
version = {attr = "herdr_trace.__version__"}

[tool.setuptools.package-data]
herdr_trace = ["web/*.html", "rules.md"]
